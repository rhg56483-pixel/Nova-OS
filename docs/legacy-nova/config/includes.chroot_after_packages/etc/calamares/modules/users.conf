---
defaultGroups: [ sudo, audio, video, plugdev, netdev, lpadmin, cdrom, scanner ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 4
  maxLength: -1
userShell: /bin/bash
allowWeakPasswords: true
allowWeakPasswordsDefault: true
